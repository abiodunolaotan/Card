<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⭐Rating card | Home</title>
  <script src="https://kit.fontawesome.com/6e32d16a02.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <a href="user.html" target="_blank">Go To User Card</a>
  <section class="hero">
    <div class="rating__content--container">
      <div class="rating__star"><i class="fa-solid fa-star" style="color: rgb(253, 115, 20);"></i></div>
  
      <div class="rating__text">
        <h3>How did we do?</h3>
        <p>Please let us know how we did with your support <br> request. All feedback is appreciated to help us <br> improve our offering!</p>
      </div>
      <div class="ratings">
        <div class="circle">1</div>
        <div class="circle">2</div>
        <div class="circle">3</div>
        <div class="circle">4</div>
        <div class="circle">5</div>
      </div>
      <div class="rating__btn">
       <button type="submit" class="btn">SUMBIT</button>
      </div>
    </div>
  </section>
</body>
</html>
